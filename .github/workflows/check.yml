name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: antifraud_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U demo -d antifraud_test' --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://demo:synthetic-local-only@127.0.0.1:5432/antifraud_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.7'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: make check
      - run: python scripts/verify_generated.py
      - run: git diff --exit-code -- contracts internal/api internal/store
      - run: test -z "$(git ls-files --others --exclude-standard contracts internal/api internal/store)"
      - run: make e2e
      - run: make demo
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: compose-logs, path: compose.log}
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npx --yes @fission-ai/openspec@1.11.0 validate protect-call-forwarding --strict
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: cd apps/mobile && bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: android-demo, path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk}
