name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '1.26.11'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: make lint
      - run: go test -race -count=1 ./...
      - run: python scripts/verify_generated.py
      - run: git diff --exit-code -- contracts internal/api internal/store
      - run: test -z "$(git ls-files --others --exclude-standard contracts internal/api internal/store)"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: antifraud_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U demo -d antifraud_test" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://demo:synthetic-local-only@127.0.0.1:5432/antifraud_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '1.26.11'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: Check out the exact PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: evaluation-base
          persist-credentials: false
      - name: Measure the PR base with the candidate evaluator
        if: github.event_name == 'pull_request'
        run: |
          cp tests/evaluation_test.go tests/evaluation_burst_test.go evaluation-base/tests/
          cd evaluation-base
          python ../scripts/evaluate.py --output ../evaluation-results/base
      - name: Measure the current commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            python scripts/evaluate.py --baseline evaluation-results/base/metrics.json --output evaluation-results/current
          else
            python scripts/evaluate.py --output evaluation-results/current
          fi
          cat evaluation-results/current/metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Measure the same cases during a burst
        run: |
          python scripts/evaluate.py --burst --baseline evaluation-results/current/metrics.json --output evaluation-results/burst
          cat evaluation-results/burst/metrics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evaluation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-evaluation
          path: evaluation-results/
          retention-days: 14
      - if: ${{ !cancelled() }}
        run: make e2e
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: make compose-lint
      - run: make demo
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: compose-logs, path: compose.log, retention-days: 7}
  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npx --yes @fission-ai/openspec@1.11.0 validate protect-call-forwarding --strict
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - run: cd apps/mobile && bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: android-demo, path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk, retention-days: 7}
